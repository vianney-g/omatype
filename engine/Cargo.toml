[package]
name = "omatype_engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Typing test engine and statistics store for omatype"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rusqlite = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"

[profile.release]
lto = true
panic = "abort"
